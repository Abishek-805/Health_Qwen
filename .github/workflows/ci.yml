name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NODE_LLAMA_CPP_POSTINSTALL: skip
      CLOUD_PROCESSING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run evaluate:pipeline
      - run: npm run build
      - run: npm run test:production
      - run: npm run test:development
      - run: npm audit --audit-level=low
